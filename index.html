<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0d0520">
<title>Egg Clicker — Le Coq Francis</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Fredoka+One&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    background: linear-gradient(160deg, #0d0520, #1a0840);
    font-family: 'Fredoka One', cursive;
    min-height: 100vh;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    overflow-x: hidden;
  }
  
  /* Sparkles animation in background */
  .sparkle {
    position: fixed;
    width: 3px;
    height: 3px;
    background: #FFD700;
    border-radius: 50%;
    box-shadow: 0 0 8px #FFD700;
    pointer-events: none;
    animation: twinkle 3s infinite;
    opacity: 0;
  }
  @keyframes twinkle {
    0%, 100% { opacity: 0; transform: scale(0.5); }
    50% { opacity: 0.8; transform: scale(1); }
  }
  
  .card {
    width: 100%;
    max-width: 360px;
    background: linear-gradient(145deg, rgba(13,5,32,0.98), rgba(30,10,65,0.98));
    border: 2px solid rgba(180,100,255,0.35);
    border-radius: 24px;
    padding: 28px 22px;
    box-shadow: 0 0 60px rgba(120,40,200,0.4);
    position: relative;
    z-index: 1;
  }
  
  .header { text-align: center; margin-bottom: 22px; }
  .header .logo { 
    font-size: 64px; 
    margin-bottom: 6px;
    filter: drop-shadow(0 0 12px rgba(255,215,0,0.6));
    animation: bob 2.5s ease-in-out infinite;
  }
  @keyframes bob {
    0%, 100% { transform: translateY(0) rotate(-2deg); }
    50% { transform: translateY(-5px) rotate(2deg); }
  }
  .header h1 {
    font-family: 'Bangers', cursive;
    font-size: 32px;
    color: #FFD700;
    letter-spacing: 3px;
    text-shadow: 0 0 20px #FFD700, 0 0 40px rgba(255,215,0,0.4);
    margin-bottom: 6px;
    line-height: 1;
  }
  .header .sub {
    font-size: 12px;
    color: #c9aaee;
    line-height: 1.7;
    letter-spacing: 1px;
  }
  .header .sub b { color: #FFD700; }
  
  /* PLAY BUTTON */
  .btn {
    width: 100%;
    padding: 18px;
    border: none;
    border-radius: 16px;
    font-size: 22px;
    font-family: 'Bangers', cursive;
    letter-spacing: 3px;
    cursor: pointer;
    color: #fff;
    margin-bottom: 12px;
    touch-action: manipulation;
    transition: all 0.15s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    position: relative;
    overflow: hidden;
  }
  .btn:active { transform: scale(0.97); opacity: 0.9; }
  .btn-play {
    background: linear-gradient(135deg, #16a34a, #15803d);
    box-shadow: 0 4px 20px rgba(22,163,74,0.5);
    font-size: 26px;
    padding: 22px;
  }
  .btn-play::before {
    content: '▶';
    font-family: sans-serif;
    font-size: 22px;
    background: rgba(255,255,255,0.25);
    width: 36px;
    height: 36px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding-left: 3px;
  }
  
  .btn-unlock {
    background: linear-gradient(135deg, #ea580c, #c2410c);
    box-shadow: 0 4px 20px rgba(234,88,12,0.4);
    flex-direction: column;
    gap: 4px;
    padding: 14px;
  }
  .btn-unlock-main {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 17px;
    letter-spacing: 2px;
  }
  .btn-unlock-main::before { content: '🔒'; font-size: 18px; }
  .btn-unlock-sub {
    font-family: 'Fredoka One', cursive;
    font-size: 11px;
    letter-spacing: 1px;
    opacity: 0.9;
    text-transform: none;
  }
  
  .btn-holder {
    background: linear-gradient(135deg, #facc15, #ca8a04);
    color: #0d0520;
    box-shadow: 0 4px 20px rgba(250,204,21,0.5);
    text-shadow: 0 0 8px rgba(255,255,255,0.4);
  }
  .btn-holder-sub {
    font-family: 'Fredoka One', cursive;
    font-size: 11px;
    color: #4a2200;
    margin-top: 2px;
    letter-spacing: 1px;
    text-transform: none;
  }
  
  /* RULES SECTION */
  .rules-card {
    background: rgba(168,85,247,0.08);
    border: 1.5px solid rgba(168,85,247,0.25);
    border-radius: 16px;
    padding: 14px 16px;
    margin-top: 8px;
  }
  .rules-title {
    font-family: 'Bangers', cursive;
    font-size: 16px;
    letter-spacing: 2px;
    color: #c084fc;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .rules-title::before { content: '💎'; font-size: 16px; }
  .rule {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    font-size: 13px;
    color: #c9aaee;
    line-height: 1.5;
    margin-bottom: 10px;
  }
  .rule:last-child { margin-bottom: 0; }
  .rule-icon { font-size: 16px; flex-shrink: 0; line-height: 1.2; }
  .rule b { color: #fff; font-weight: normal; font-family: 'Bangers', cursive; letter-spacing: 1.5px; font-size: 14px; }
  .rule .accent { color: #FFD700; font-family: 'Bangers', cursive; letter-spacing: 1.5px; font-size: 15px; }
  
  /* Status badge */
  .status-pill {
    display: inline-block;
    padding: 4px 10px;
    border-radius: 12px;
    font-size: 10px;
    letter-spacing: 1px;
    margin-top: 8px;
    font-family: 'Bangers', cursive;
  }
  .status-checking { background: rgba(168,85,247,0.2); color: #c084fc; }
  .status-disconnected { background: rgba(234,88,12,0.15); color: #fb923c; }
  .status-no-franc { background: rgba(217,119,6,0.15); color: #fcd34d; }
  .status-holder { background: rgba(22,163,74,0.2); color: #86efac; border: 1px solid rgba(163,230,53,0.4); }
  .status-hidden { display: none; }
</style>
</head>
<body>

<!-- Twinkling sparkles -->
<div id="sparkleContainer"></div>

<div class="card">
  <div class="header">
    <div class="logo">🐓</div>
    <h1>EGG CLICKER</h1>
    <p class="sub">TAP THE ROOSTER · BUILD THE EMPIRE<br><b>$FRANC</b> HOLDERS PLAY UNLIMITED</p>
  </div>

  <button class="btn btn-play" id="playBtn" onclick="startGame()">PLAY</button>

  <button class="btn btn-unlock" id="unlockBtn" onclick="openWallet()">
    <div class="btn-unlock-main">TAP TO UNLOCK UNLIMITED</div>
    <div class="btn-unlock-sub" id="walletStatus">Wallet not connected · checking…</div>
  </button>

  <div class="rules-card">
    <div class="rules-title">$FRANC RULES</div>
    <div class="rule">
      <div class="rule-icon">💜</div>
      <div>Without <b>$FRANC</b> : <span class="accent">10 min session</span> · progress saved</div>
    </div>
    <div class="rule">
      <div class="rule-icon">💚</div>
      <div>Holding <b>$FRANC</b> : <span class="accent">unlimited play</span> + cloud save + leaderboard</div>
    </div>
  </div>
</div>

<script>
const BACKEND  = 'https://mubqtnqulpyehkgubhnh.supabase.co/functions/v1';
const WALLET_URL = 'https://franclecoq.github.io/Wallet/connect-wallet.html';
const GAME_URL = './game.html'; // relative to this homepage

const tg = window.Telegram?.WebApp;

// Sparkle particles
function spawnSparkles() {
  const c = document.getElementById('sparkleContainer');
  for (let i = 0; i < 12; i++) {
    const s = document.createElement('div');
    s.className = 'sparkle';
    s.style.left = Math.random() * 100 + 'vw';
    s.style.top = Math.random() * 100 + 'vh';
    s.style.animationDelay = (Math.random() * 3) + 's';
    s.style.animationDuration = (2 + Math.random() * 3) + 's';
    c.appendChild(s);
  }
}

// Detect $FRANC holder status
let isHolder = false;
let lives = 1;

async function checkHolderStatus() {
  const statusEl = document.getElementById('walletStatus');
  const unlockBtn = document.getElementById('unlockBtn');
  
  if (!tg?.initData) {
    statusEl.textContent = 'Open via Telegram to connect';
    return;
  }
  
  try {
    const res = await fetch(BACKEND + '/check-franc', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ initData: tg.initData })
    });
    const d = await res.json();
    
    if (d.walletLinked && d.hasFranc) {
      // HOLDER mode
      isHolder = true;
      lives = d.lives || 10;
      const bal = d.balance ? Number(d.balance).toLocaleString() : '?';
      
      unlockBtn.classList.remove('btn-unlock');
      unlockBtn.classList.add('btn-holder');
      unlockBtn.innerHTML = `
        <div class="btn-unlock-main">🪙 $FRANC HOLDER · UNLIMITED</div>
        <div class="btn-holder-sub">${bal} $FRANC detected</div>
      `;
      unlockBtn.onclick = null;
      unlockBtn.style.cursor = 'default';
    } else if (d.walletLinked) {
      // Connected but no $FRANC
      statusEl.textContent = 'Wallet linked · no $FRANC · 10 min trial';
    } else {
      // Not connected
      statusEl.textContent = 'Wallet not connected · 10 min trial';
    }
  } catch (e) {
    statusEl.textContent = 'Connection error · 10 min trial';
  }
}

function startGame() {
  // Pass holder status via query string
  const url = GAME_URL + '?mode=' + (isHolder ? 'unlimited' : 'trial') + '&t=' + Date.now();
  window.location.href = url;
}

function openWallet() {
  if (tg) {
    // Open wallet mini-app inside Telegram
    window.location.href = WALLET_URL;
  } else {
    window.open(WALLET_URL, '_blank');
  }
}

// Init
window.addEventListener('load', () => {
  spawnSparkles();
  if (tg) {
    tg.ready();
    tg.expand();
  }
  checkHolderStatus();
});

// Refresh status when returning to the page (e.g. after wallet linking)
document.addEventListener('visibilitychange', () => {
  if (!document.hidden) checkHolderStatus();
});
</script>
</body>
</html>
