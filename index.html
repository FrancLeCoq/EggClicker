<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0d0520">
<title>Egg Clicker — Le Coq Francis</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Fredoka+One&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    background: linear-gradient(160deg, #0d0520, #1a0840);
    font-family: 'Fredoka One', cursive;
    min-height: 100vh;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    overflow-x: hidden;
  }

  .sparkle {
    position: fixed;
    width: 3px;
    height: 3px;
    background: #FFD700;
    border-radius: 50%;
    box-shadow: 0 0 8px #FFD700;
    pointer-events: none;
    animation: twinkle 3s infinite;
    opacity: 0;
  }
  @keyframes twinkle {
    0%, 100% { opacity: 0; transform: scale(0.5); }
    50% { opacity: 0.8; transform: scale(1); }
  }

  .card {
    width: 100%;
    max-width: 360px;
    background: linear-gradient(145deg, rgba(13,5,32,0.98), rgba(30,10,65,0.98));
    border: 2px solid rgba(180,100,255,0.35);
    border-radius: 24px;
    padding: 28px 22px;
    box-shadow: 0 0 60px rgba(120,40,200,0.4);
    position: relative;
    z-index: 1;
  }

  .header { text-align: center; margin-bottom: 22px; }
  .header .logo {
    font-size: 64px;
    margin-bottom: 6px;
    filter: drop-shadow(0 0 12px rgba(255,215,0,0.6));
    animation: bob 2.5s ease-in-out infinite;
  }
  @keyframes bob {
    0%, 100% { transform: translateY(0) rotate(-2deg); }
    50% { transform: translateY(-5px) rotate(2deg); }
  }
  .header h1 {
    font-family: 'Bangers', cursive;
    font-size: 32px;
    color: #FFD700;
    letter-spacing: 3px;
    text-shadow: 0 0 20px #FFD700, 0 0 40px rgba(255,215,0,0.4);
    margin-bottom: 6px;
    line-height: 1;
  }
  .header .sub {
    font-size: 12px;
    color: #c9aaee;
    line-height: 1.7;
    letter-spacing: 1px;
  }
  .header .sub b { color: #FFD700; }

  .btn {
    width: 100%;
    padding: 18px;
    border: none;
    border-radius: 16px;
    font-size: 22px;
    font-family: 'Bangers', cursive;
    letter-spacing: 3px;
    cursor: pointer;
    color: #fff;
    margin-bottom: 12px;
    touch-action: manipulation;
    transition: all 0.15s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    position: relative;
    overflow: hidden;
  }
  .btn:active { transform: scale(0.97); opacity: 0.9; }

  /* RESUME (primary green) */
  .btn-resume {
    background: linear-gradient(135deg, #16a34a, #15803d);
    box-shadow: 0 4px 20px rgba(22,163,74,0.5);
    font-size: 24px;
    padding: 20px;
  }
  .btn-resume::before {
    content: '▶';
    font-family: sans-serif;
    font-size: 20px;
    background: rgba(255,255,255,0.25);
    width: 34px;
    height: 34px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding-left: 3px;
  }

  /* NEW GAME (purple) */
  .btn-new {
    background: linear-gradient(135deg, #7c3aed, #5b21b6);
    box-shadow: 0 4px 20px rgba(124,58,237,0.45);
    font-size: 20px;
    padding: 16px;
  }
  .btn-new::before { content: '✨'; font-size: 18px; }

  /* WALLET / UNLOCK */
  .btn-unlock {
    background: rgba(168,85,247,0.12);
    border: 1.5px solid rgba(168,85,247,0.45);
    box-shadow: none;
    flex-direction: column;
    gap: 4px;
    padding: 14px;
    color: #e9d5ff;
  }
  .btn-unlock-main {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 17px;
    letter-spacing: 2px;
  }
  .btn-unlock-main::before { content: '🔒'; font-size: 18px; }
  .btn-unlock-sub {
    font-family: 'Fredoka One', cursive;
    font-size: 11px;
    letter-spacing: 1px;
    opacity: 0.9;
    text-transform: none;
  }

  .btn-holder {
    background: linear-gradient(135deg, #4ade80, #16a34a);
    color: #0d3320;
    box-shadow: 0 4px 20px rgba(250,204,21,0.5);
    text-shadow: 0 0 8px rgba(255,255,255,0.4);
    flex-direction: column;
    gap: 4px;
    padding: 14px;
  }
  .btn-holder .btn-unlock-main::before { content: '🔓'; }
  .btn-holder-sub {
    font-family: 'Fredoka One', cursive;
    font-size: 11px;
    color: #4a2200;
    margin-top: 2px;
    letter-spacing: 1px;
    text-transform: none;
  }

  /* LANGUAGE ROW */
  .lang-row {
    text-align: center;
    margin: 14px 0 4px;
  }
  .lang-label {
    font-family: 'Bangers', cursive;
    font-size: 14px;
    letter-spacing: 2px;
    color: #c084fc;
    margin-bottom: 8px;
  }
  .lang-flags { display: flex; gap: 12px; justify-content: center; }
  .lang-flag {
    font-size: 30px;
    background: rgba(168,85,247,0.1);
    border: 2px solid transparent;
    border-radius: 12px;
    padding: 5px 14px;
    cursor: pointer;
    transition: all 0.15s;
    line-height: 1;
  }
  .lang-flag.sel { border-color: #FFD700; background: rgba(255,215,0,0.15); box-shadow: 0 0 12px rgba(255,215,0,0.3); }
  .lang-flag:active { transform: scale(0.92); }

  /* RULES */
  .rules-card {
    background: rgba(168,85,247,0.08);
    border: 1.5px solid rgba(168,85,247,0.25);
    border-radius: 16px;
    padding: 14px 16px;
    margin-top: 12px;
  }
  .rules-title {
    font-family: 'Bangers', cursive;
    font-size: 16px;
    letter-spacing: 2px;
    color: #c084fc;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .rules-title::before { content: '💎'; font-size: 16px; }
  .rule {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    font-size: 13px;
    color: #c9aaee;
    line-height: 1.5;
    margin-bottom: 10px;
  }
  .rule:last-child { margin-bottom: 0; }
  .rule-icon { font-size: 16px; flex-shrink: 0; line-height: 1.2; }
  .rule b { color: #fff; font-weight: normal; font-family: 'Bangers', cursive; letter-spacing: 1.5px; font-size: 14px; }
  .rule .accent { color: #FFD700; font-family: 'Bangers', cursive; letter-spacing: 1.5px; font-size: 15px; }
</style>
</head>
<body>

<div id="sparkleContainer"></div>

<div class="card">
  <div class="header">
    <div class="logo">🐓</div>
    <h1>EGG CLICKER</h1>
    <p class="sub" id="subText"></p>
  </div>

  <button class="btn btn-resume" id="resumeBtn" onclick="resumeGame()"><span id="resumeTxt">Resume game</span></button>

  <button class="btn btn-new" id="newBtn" onclick="newGame()"><span id="newTxt">New game</span></button>

  <button class="btn btn-unlock" id="unlockBtn" onclick="openWallet()">
    <div class="btn-unlock-main" id="unlockMain">Connect wallet</div>
    <div class="btn-unlock-sub" id="walletStatus">Wallet not connected · checking…</div>
  </button>

  <div class="lang-row">
    <div class="lang-label" id="langLabel">LANGUAGE</div>
    <div class="lang-flags">
      <button class="lang-flag" id="flagFR" title="Français" onclick="setLang('fr')">🇫🇷</button>
      <button class="lang-flag" id="flagEN" title="English" onclick="setLang('en')">🇬🇧</button>
    </div>
  </div>

  <div class="rules-card">
    <div class="rules-title" id="rulesTitle">$FRANC RULES</div>
    <div class="rule">
      <div class="rule-icon">💜</div>
      <div id="ruleTrial"></div>
    </div>
    <div class="rule">
      <div class="rule-icon">💚</div>
      <div id="ruleHolder"></div>
    </div>
  </div>
</div>

<script>
const BACKEND  = 'https://mubqtnqulpyehkgubhnh.supabase.co/functions/v1';
const WALLET_URL = 'https://franclecoq.github.io/Wallet/connect-wallet.html';
const GAME_URL = './game.html';

const tg = window.Telegram?.WebApp;

// ============ I18N ============
let LANG = localStorage.getItem('francCoqLang') || 'en';
const I18N = {
  en: {
    sub: 'TAP THE ROOSTER · BUILD THE EMPIRE<br><b>$FRANC</b> HOLDERS PLAY UNLIMITED',
    resume: 'Resume game',
    newGame: 'New game',
    connectWallet: 'Connect wallet',
    langLabel: 'LANGUAGE',
    rulesTitle: '$FRANC RULES',
    ruleTrial: 'Without <b>$FRANC</b> : <span class="accent">10 min session</span> · progress saved',
    ruleHolder: 'Holding <b>$FRANC</b> : <span class="accent">unlimited play</span>',
    newConfirm: 'Start a new game? Your saved progress will be lost.',
    wOpenTelegram: 'Open via Telegram to connect',
    wLinkedNoFranc: 'Wallet linked · no $FRANC · 10 min trial',
    wNotConnected: 'Wallet not connected · 10 min trial',
    wError: 'Connection error · 10 min trial',
    wChecking: 'Wallet not connected · checking…',
    holderMain: '🪙 $FRANC HOLDER · UNLIMITED',
    holderSub: (b) => `${b} $FRANC detected`
  },
  fr: {
    sub: 'TAPE LE COQ · BÂTIS L\'EMPIRE<br>LES HOLDERS <b>$FRANC</b> JOUENT SANS LIMITE',
    resume: 'Reprendre la partie',
    newGame: 'Nouvelle partie',
    connectWallet: 'Connecter le wallet',
    langLabel: 'LANGUE',
    rulesTitle: 'RÈGLES $FRANC',
    ruleTrial: 'Sans <b>$FRANC</b> : <span class="accent">session 10 min</span> · progression sauvegardée',
    ruleHolder: 'Avec <b>$FRANC</b> : <span class="accent">jeu illimité</span>',
    newConfirm: 'Démarrer une nouvelle partie ? Ta progression sauvegardée sera perdue.',
    wOpenTelegram: 'Ouvre via Telegram pour connecter',
    wLinkedNoFranc: 'Wallet lié · pas de $FRANC · essai 10 min',
    wNotConnected: 'Wallet non connecté · essai 10 min',
    wError: 'Erreur de connexion · essai 10 min',
    wChecking: 'Wallet non connecté · vérification…',
    holderMain: '🪙 HOLDER $FRANC · ILLIMITÉ',
    holderSub: (b) => `${b} $FRANC détecté`
  }
};
function t(k){ return I18N[LANG][k] !== undefined ? I18N[LANG][k] : I18N.en[k]; }

function applyLang(){
  document.documentElement.lang = LANG;
  document.getElementById('subText').innerHTML = t('sub');
  document.getElementById('resumeTxt').textContent = t('resume');
  document.getElementById('newTxt').textContent = t('newGame');
  document.getElementById('langLabel').textContent = t('langLabel');
  document.getElementById('rulesTitle').textContent = t('rulesTitle');
  document.getElementById('ruleTrial').innerHTML = t('ruleTrial');
  document.getElementById('ruleHolder').innerHTML = t('ruleHolder');
  document.getElementById('flagFR').classList.toggle('sel', LANG === 'fr');
  document.getElementById('flagEN').classList.toggle('sel', LANG === 'en');
  // Refresh wallet button label (unless already holder)
  if (!isHolder) {
    const main = document.getElementById('unlockMain');
    if (main) main.textContent = t('connectWallet');
  }
  refreshWalletStatusText();
}
function setLang(l){
  LANG = l;
  localStorage.setItem('francCoqLang', l);
  applyLang();
}

// ============ SPARKLES ============
function spawnSparkles() {
  const c = document.getElementById('sparkleContainer');
  for (let i = 0; i < 12; i++) {
    const s = document.createElement('div');
    s.className = 'sparkle';
    s.style.left = Math.random() * 100 + 'vw';
    s.style.top = Math.random() * 100 + 'vh';
    s.style.animationDelay = (Math.random() * 3) + 's';
    s.style.animationDuration = (2 + Math.random() * 3) + 's';
    c.appendChild(s);
  }
}

// ============ $FRANC HOLDER DETECTION ============
let isHolder = false;
let _lastStatusKey = 'wChecking';

function refreshWalletStatusText(){
  if (isHolder) return;
  const el = document.getElementById('walletStatus');
  if (el) el.textContent = t(_lastStatusKey);
}

async function checkHolderStatus() {
  const statusEl = document.getElementById('walletStatus');
  const unlockBtn = document.getElementById('unlockBtn');

  if (!tg?.initData) {
    _lastStatusKey = 'wOpenTelegram';
    refreshWalletStatusText();
    return;
  }

  try {
    const res = await fetch(BACKEND + '/check-franc', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ initData: tg.initData })
    });
    const d = await res.json();

    if (d.walletLinked && d.hasFranc) {
      // HOLDER mode — open padlock, unlimited
      isHolder = true;
      const bal = d.balance ? Number(d.balance).toLocaleString() : '?';
      unlockBtn.classList.remove('btn-unlock');
      unlockBtn.classList.add('btn-holder');
      unlockBtn.innerHTML = `
        <div class="btn-unlock-main">${t('holderMain')}</div>
        <div class="btn-holder-sub">${t('holderSub')(bal)}</div>
      `;
      unlockBtn.onclick = null;
      unlockBtn.style.cursor = 'default';
    } else if (d.walletLinked) {
      _lastStatusKey = 'wLinkedNoFranc';
      refreshWalletStatusText();
    } else {
      _lastStatusKey = 'wNotConnected';
      refreshWalletStatusText();
    }
  } catch (e) {
    _lastStatusKey = 'wError';
    refreshWalletStatusText();
  }
}

// ============ NAVIGATION ============
function gameUrl(extra) {
  let url = GAME_URL + '?mode=' + (isHolder ? 'unlimited' : 'trial') + '&lang=' + LANG + '&t=' + Date.now();
  if (extra) url += extra;
  return url;
}
function resumeGame() {
  window.location.href = gameUrl('');
}
function newGame() {
  if (confirm(t('newConfirm'))) {
    window.location.href = gameUrl('&new=1');
  }
}
function openWallet() {
  if (tg) {
    window.location.href = WALLET_URL;
  } else {
    window.open(WALLET_URL, '_blank');
  }
}

// ============ INIT ============
window.addEventListener('load', () => {
  spawnSparkles();
  applyLang();
  if (tg) { tg.ready(); tg.expand(); }
  checkHolderStatus();
});

document.addEventListener('visibilitychange', () => {
  if (!document.hidden) checkHolderStatus();
});
</script>
</body>
</html>
